<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Site d'information de la CGT ABB France : négociations, actualités, documents et contact."
  >

  <title>CGT ABB France | Information des salariés</title>

  <style>

    :root {
      --red: #b5121b;
      --darkred: #760d14;
      --ink: #191919;
      --muted: #606060;
      --line: #e5e5e5;
      --paper: #f6f6f4;
      --white: #ffffff;
      --dark: #171717;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    .wrap {
      width: min(1120px, calc(100% - 36px));
      margin: auto;
    }

    section {
      scroll-margin-top: 86px;
    }


    /* =========================
       EN-TETE
       ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--red);
      color: white;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.2);
    }

    .head {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .brand {
      text-decoration: none;
    }

    .brand strong {
      display: block;
      font-size: 25px;
      line-height: 1;
    }

    .brand span {
      display: block;
      font-size: 12px;
      margin-top: 7px;
      color: #ffe5e5;
    }

    nav {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      font-weight: 700;
    }

    nav a:hover {
      text-decoration: underline;
    }


    /* =========================
       ACCUEIL
       ========================= */

    .hero {
      background: linear-gradient(
        135deg,
        var(--red),
        var(--darkred)
      );

      color: white;
      padding: 86px 0 94px;
    }

    .kicker {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.33);
      background: rgba(255, 255, 255, 0.10);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
    }

    .hero h1 {
      max-width: 900px;
      margin: 24px 0 0;
      font-size: clamp(42px, 7vw, 70px);
      line-height: 1.02;
    }

    .hero h1 span {
      color: #ffd9db;
    }

    .hero p {
      max-width: 760px;
      font-size: 20px;
      color: #fff1f1;
      margin: 24px 0 0;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .btn {
      display: inline-block;
      padding: 13px 20px;
      border-radius: 9px;
      text-decoration: none;
      font-weight: 800;
    }

    .primary {
      background: white;
      color: var(--red);
    }

    .secondary {
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: white;
    }


    /* =========================
       SECTIONS
       ========================= */

    .section {
      padding: 68px 0;
    }

    .label {
      font-size: 13px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--red);
      font-weight: 900;
    }

    .section h2 {
      font-size: clamp(30px, 4vw, 42px);
      line-height: 1.15;
      margin: 5px 0 12px;
    }

    .lead {
      max-width: 760px;
      color: var(--muted);
      font-size: 17px;
    }


    /* =========================
       CARTES
       ========================= */

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 34px;
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 26px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.05);
    }

    .icon {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      background: #fff0f0;
      border-radius: 12px;
      font-size: 25px;
    }

    .card h3 {
      margin: 18px 0 7px;
      font-size: 21px;
    }

    .card p {
      margin: 0;
      color: var(--muted);
    }


    /* =========================
       CALENDRIER
       ========================= */

    .calendar {
      background: white;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 54px;
    }

    .event {
      display: flex;
      gap: 18px;
      background: #fafafa;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 15px;
    }

    .eventmark {
      width: 48px;
      height: 48px;
      min-width: 48px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--red);
      border-radius: 11px;
      font-size: 22px;
    }

    .date {
      font-size: 19px;
      font-weight: 900;
    }

    .time {
      font-weight: 800;
      color: var(--red);
    }

    .event h3 {
      margin: 7px 0 2px;
    }

    .event p {
      margin: 0;
      color: var(--muted);
    }


    /* =========================
       ACTUALITES
       ========================= */

    .news {
      background: var(--dark);
      color: white;
    }

    .news .label {
      color: #ff797f;
    }

    .news .lead {
      color: #d2d2d2;
    }

    .news-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
    }

    .scan {
      border: 1px solid #444444;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 28px;
    }

    .scan-icon {
      font-size: 42px;
    }

    .scan b {
      display: block;
      margin-top: 8px;
      font-size: 22px;
    }

    .scan p {
      color: #d2d2d2;
      margin-bottom: 0;
    }


    /* =========================
       DOCUMENTS
       ========================= */

    .doc {
      margin-top: 26px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 26px;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .document-content {
      flex: 1;
    }

    .doc h3 {
      margin: 0;
    }

    .doc p {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .pill {
      white-space: nowrap;
      background: #eeeeee;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }


    /* =========================
       CONTACT
       ========================= */

    .contact {
      background: var(--red);
      color: white;
    }

    .contact-row {
      display: flex;
      justify-content: space-between;
      gap: 30px;
      align-items: center;
    }

      margin
