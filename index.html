<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CGT ABB France</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f5f5f5;
    color: #222222;
    line-height: 1.6;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 0 25px;
}

/* EN-TETE */

header {
    background-color: #b91c1c;
    color: white;
    padding: 20px 0;
}

.header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 25px;
}

.logo {
    font-size: 27px;
    font-weight: bold;
}

.slogan {
    font-size: 13px;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    margin-left: 20px;
}

nav a:hover {
    text-decoration: underline;
}

/* ACCUEIL */

.hero {
    background-color: #991b1b;
    color: white;
    padding: 80px 0;
}

.hero h1 {
    font-size: 52px;
    line-height: 1.1;
    margin: 0;
}

.hero h2 {
    font-size: 32px;
    color: #fee2e2;
    margin-top: 12px;
}

.hero p {
    font-size: 20px;
    max-width: 720px;
    margin-top: 25px;
}

.button {
    display: inline-block;
    margin-top: 20px;
    margin-right: 10px;
    padding: 14px 22px;
    background-color: white;
    color: #b91c1c;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
}

/* SECTIONS */

section {
    padding: 65px 0;
}

.section-title {
    color: #b91c1c;
    font-weight: bold;
    text-transform: uppercase;
    font-size: 14px;
}

h2 {
    font-size: 36px;
    margin-top: 5px;
    margin-bottom: 15px;
}

.intro {
    color: #555555;
    font-size: 17px;
    max-width: 760px;
}

/* CARTES */

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    margin-top: 35px;
}

.card {
    background-color: white;
    border-radius: 12px;
    padding: 28px;
    border: 1px solid #dddddd;
}

.card-icon {
    font-size: 34px;
}

.card h3 {
    font-size: 21px;
}

.card p {
    color: #555555;
}

/* CALENDRIER */

.calendar {
    background-color: white;
}

.event {
    background-color: #f9f9f9;
    border-left: 6px solid #b91c1c;
    margin-top: 20px;
    padding: 22px;
    border-radius: 6px;
}

.event-date {
    font-size: 20px;
    font-weight: bold;
}

.event-time {
    color: #b91c1c;
    font-weight: bold;
}

/* ACTUALITES */

.actualites {
    background-color: #18181b;
    color: white;
}
